[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scwb-v2-python-reference"
version = "0.1.0"
description = "Test-only Python operation-pack ABI v2 conformance fixture"
requires-python = ">=3.11"
dependencies = ["pybench==0.1.0"]

[project.entry-points."scworkbench.operation_packs.v2"]
reference = "scwbpyv2reference.pack:register"

[tool.hatch.build.targets.wheel]
packages = ["src/scwbpyv2reference"]

[tool.hatch.build.targets.wheel.force-include]
"operation-pack.json" = "scwbpyv2reference/operation-pack.json"
