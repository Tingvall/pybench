[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scwb-v3-python-reference"
version = "0.1.0"
description = "Test-only Python operation-pack ABI v3 conformance fixture"
requires-python = ">=3.11"
dependencies = ["pybench==0.1.1"]

[project.entry-points."scworkbench.operation_packs.v3"]
reference = "scwbpyv3reference.pack:register"

[tool.hatch.build.targets.wheel]
packages = ["src/scwbpyv3reference"]

[tool.hatch.build.targets.wheel.force-include]
"operation-pack.json" = "scwbpyv3reference/operation-pack.json"
